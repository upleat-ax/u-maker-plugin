name: deploy-{{target}}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup runtime
        run: |
          # TODO: pick language/runtime per project
          echo "Setting up runtime for {{appName}}"

      - name: Install deps
        run: |
          {{installCmd}}

      - name: Build
        run: |
          {{buildCmd}}

      - name: Test
        run: |
          {{testCmd}}

      - name: Deploy to {{target}}
        if: github.ref == 'refs/heads/main'
        env:
          {{#secrets}}
          {{name}}: ${{ secrets.{{name}} }}
          {{/secrets}}
        run: |
          {{deployCmd}}
