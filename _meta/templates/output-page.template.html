<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{docTitle}} — {{appName}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
tailwind.config={darkMode:'class'};
(function waitForMermaid(){
  if(typeof mermaid!=='undefined'){
    mermaid.initialize({startOnLoad:false,theme:'default',flowchart:{curve:'basis'},er:{useMaxWidth:true},sequence:{useMaxWidth:true,mirrorActors:false}});
    mermaid.run();
  }else{setTimeout(waitForMermaid,50);}
})();
</script>
<style>
/* ============================================================
   u-maker document theme — typography / color / prose rhythm
   default palette: gray + pale blue. colorblind mode: Okabe-Ito 기반 고대비 예외.
   ============================================================ */
:root{
  --bg:#fff;--panel:#f2f5f8;--soft:#f8fafc;--surface:#fff;
  --fg:#111827;--muted:#4b5563;--dim:#6b7280;--border:#e2e8f0;
  --accent:#3d6fa5;--accent-strong:#2c5580;--accent-soft:#a8c4e0;
  --accent-bg:#eef3f9;--accent-line:#b8cee4;--hi:#dbe7f5;
  --ok-bg:#eef3f9;--ok-fg:#2c5580;--bad-bg:#f9f0ef;--bad-fg:#b91c1c;
  --warn-bg:#f7f0ea;--warn-fg:#c2410c;
  --plan:#2c5580;--build:#3d6fa5;--gate:#64748b;--deploy:#334155;
  --shadow:0 1px 2px rgba(17,17,17,.05);
  --content-w:1080px;
}
.dark{
  --bg:#0f1319;--panel:#161c24;--soft:#131920;--surface:#131920;
  --fg:#e6edf3;--muted:#9aa7b6;--dim:#7d8998;--border:#242c37;
  --accent:#8ab4e0;--accent-strong:#a8c4e0;--accent-soft:#a8c4e0;
  --accent-bg:#172230;--accent-line:#2c435c;--hi:#20344c;
  --ok-bg:#172230;--ok-fg:#a8c4e0;--bad-bg:#261a18;--bad-fg:#fca5a5;
  --warn-bg:#26201a;--warn-fg:#d9b48c;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}
.colorblind{
  color-scheme:light;
  --bg:#fff;--panel:#f1f5f7;--soft:#f7fafb;--surface:#fff;
  --fg:#1a1a1a;--muted:#3f4a54;--dim:#56616a;--border:#7c8993;
  --accent:#0072b2;--accent-strong:#005a8d;--accent-soft:#56b4e9;
  --accent-bg:#e6f3f8;--accent-line:#56b4e9;--hi:#d7eef7;
  --ok-bg:#e6f3f8;--ok-fg:#005a8d;--bad-bg:#fff0e8;--bad-fg:#9f4500;
  --warn-bg:#fff4d6;--warn-fg:#704700;
  --plan:#0072b2;--build:#8a5700;--gate:#8f4a80;--deploy:#1a1a1a;
  --shadow:0 1px 3px rgba(26,26,26,.12);
}
.colorblind :focus-visible{outline:3px solid #8a5700;outline-offset:3px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
     color:var(--fg);font-size:14.5px;line-height:1.8;letter-spacing:-0.005em;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---- 문단 구조 ---- */
.doc-container{max-width:var(--content-w);margin:0 auto;padding:36px 24px 110px}
.hero{border-bottom:1px solid var(--fg);padding-bottom:20px;margin-bottom:28px}
.hero h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-0.5px;line-height:1.35}
.hero .sub{color:var(--muted);margin-top:10px;font-size:13px;line-height:1.9}
.hero .highlight{background:var(--hi);color:var(--fg);padding:0 6px;border-radius:2px}
h1{font-size:27px;font-weight:700;letter-spacing:-0.5px;line-height:1.35;margin:0 0 10px}
h2{font-size:17px;font-weight:700;line-height:1.5;margin:0 0 6px}
h3{font-size:14.5px;font-weight:800;margin:22px 0 6px;line-height:1.6}
h4{font-size:13px;font-weight:700;margin:16px 0 4px;line-height:1.6}
h2+p,h3+p{margin-top:0}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:20px}
li{margin:2px 0}
section,.blk{margin-bottom:54px}
.qword{background:var(--hi);color:var(--fg);padding:0 8px;border-radius:2px;margin-right:6px}
.section-hint{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.85}
.section-hint b{color:var(--fg)}
.thesis{background:var(--fg);color:#fff;border-radius:14px;padding:22px 26px;font-size:16px;line-height:2.0;margin-bottom:16px}
.thesis b{color:var(--accent-soft)}
.thesis .k{font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;color:#9ca3af;display:block;margin-bottom:6px}
.dark .thesis{background:#080a0e}
.note,.flowfoot{font-size:12px;color:var(--muted);line-height:1.8;border-top:1px dashed var(--border);padding-top:10px;margin-top:14px}
.note b,.flowfoot b{color:var(--fg)}

/* ---- 면 처리: 컨테이너는 fill, 카드는 white + 미세 그림자 (단면 border 금지) ---- */
.panel{background:var(--panel);border-radius:14px;padding:22px 20px;margin:16px 0;overflow-x:auto}
.card{background:var(--surface);border-radius:11px;box-shadow:var(--shadow);padding:13px 15px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 11px;line-height:1.6;background:var(--panel);color:#374151}
.dark .tag{color:var(--muted)}
.tag.good{background:var(--ok-bg);color:var(--ok-fg)}
.tag.bad{background:var(--bad-bg);color:var(--bad-fg)}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}

/* ---- simple list: repeated text rows use dividers, not stacked cards ---- */
.simple-list{list-style:none;margin:10px 0 16px;padding:0}
.simple-list>li,.simple-list-row{margin:0;padding:12px 8px;border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent;box-shadow:none}
.simple-list>li{display:flex;align-items:baseline;gap:12px}
.simple-list>.simple-list-row{display:grid;grid-template-columns:minmax(140px,.75fr) minmax(0,1fr) auto;align-items:baseline;gap:12px}
.simple-list>li:last-child,.simple-list-row:last-child{border-bottom:0}
.simple-list>.is-current{background:var(--accent-bg);font-weight:700}
.simple-list--numbered{counter-reset:simple-list}
.simple-list--numbered>li{counter-increment:simple-list}
.simple-list--numbered>li::before{content:counter(simple-list,decimal-leading-zero);flex:0 0 2.2em;color:var(--accent);font:700 12px/1.8 ui-monospace,'JetBrains Mono','Fira Code',monospace}
.simple-list .list-label{font-weight:700;color:var(--fg)}
.simple-list .list-detail{min-width:0;color:var(--muted)}
.simple-list .list-meta{color:var(--dim);font:600 12px/1.8 ui-monospace,'JetBrains Mono','Fira Code',monospace;white-space:nowrap}

/* ---- meta bar / TOC ---- */
.meta-bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 26px;font-size:11.5px;color:var(--muted)}
.meta-bar span{background:var(--panel);padding:3px 11px;border-radius:999px;font-weight:700}
.toc{background:var(--panel);border-radius:14px;padding:18px 22px;margin:0 0 40px}
.toc h4{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);margin:0 0 8px}
.toc ul{list-style:none;padding-left:0;margin:0}
.toc li{font-size:12.5px;padding:2px 0;line-height:1.7}
.toc ul ul{padding-left:14px}

/* ---- table: 4변 border 없이 1px 중립 divider만 ---- */
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.5px;line-height:1.7}
th{background:var(--panel);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);color:var(--fg)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--muted)}
td strong,td b{color:var(--fg)}
tbody tr:hover td{background:var(--soft)}
/* 채움 면(.panel) 안의 표는 흰 카드로 띄운다 */
.panel table{background:var(--surface);border-radius:12px;margin:0}
.panel th{background:var(--surface);color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.9px}
.panel tbody tr:last-child td{border-bottom:0}
.panel tbody tr:hover td{background:var(--accent-bg)}

code{background:var(--panel);padding:2px 6px;border-radius:4px;font-size:12px;font-family:ui-monospace,'JetBrains Mono','Fira Code',monospace}
pre{background:#111827;color:#e2e8f0;padding:16px 18px;border-radius:12px;overflow-x:auto;font-size:12px;line-height:1.7}
pre code{background:none;padding:0;color:inherit}
blockquote{margin:14px 0;padding:14px 18px;background:var(--accent-bg);border-radius:12px;color:var(--muted);font-size:13px}
hr{border:0;border-top:1px dashed var(--border);margin:26px 0}

.mermaid{margin:16px 0;text-align:center}
.mermaid-wrapper{background:#fff;border-radius:12px;padding:16px;margin:16px 0}
svg{max-width:100%}
figure{margin:16px 0}
figcaption{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:9px;text-align:center}

.footer{padding-top:16px;margin-top:40px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.95;text-align:center}

/* ---- floating controls ---- */
.fab-stack{position:fixed;right:22px;bottom:26px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{background:#fff;color:var(--fg);border:0;border-radius:999px;padding:10px 18px;font:700 12.5px/1.4 inherit;letter-spacing:-0.005em;
     box-shadow:0 4px 14px rgba(17,17,17,.13);cursor:pointer;white-space:nowrap}
.fab:hover{background:var(--panel)}
.dark .fab{background:#161c24;color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.55)}
.fab-round{width:46px;height:46px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-size:15px;
           box-shadow:0 4px 14px rgba(61,111,165,.38)}
.dark .fab-round{background:var(--accent);color:#0f1319}

@media (max-width:760px){
  .doc-container{padding:24px 16px 96px}
  .hero h1,h1{font-size:22px}
  .simple-list>.simple-list-row{grid-template-columns:1fr auto;gap:2px 10px}
  .simple-list-row .list-detail{grid-column:1/-1}
  .fab-stack{right:14px;bottom:16px}
}
@media print{
  @page{size:A4;margin:12mm}
  body{font-size:12px}
  .fab-stack{display:none}
  .panel,.card,table,figure{page-break-inside:avoid;break-inside:avoid}
  h2,h3,.section-hint{page-break-after:avoid;break-after:avoid}
  .thesis,.tag,.qword{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<!-- Floating controls: theme · width · top -->
<div class="fab-stack">
  <button class="fab" id="theme-toggle" aria-label="다크 모드로 전환" title="현재 테마: 라이트"><i class="fa-solid fa-moon" id="theme-icon" aria-hidden="true"></i> <span id="theme-label">다크 모드</span></button>
  <button class="fab" id="width-toggle" aria-label="Toggle content width"><span id="width-label">본문 넓게</span></button>
  <button class="fab fab-round" id="to-top" aria-label="Scroll to top"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
</div>

<div class="doc-container" id="doc">

  <header class="hero">
    <h1>{{docTitle}}</h1>
    <div class="sub">{{appName}} · 최종 수정 {{lastUpdated}}</div>
  </header>

  <div class="meta-bar">
    <span>App {{appName}}</span>
    <span>Status {{status}}</span>
    <span>v{{version}}</span>
    <span>Updated {{lastUpdated}}</span>
  </div>

  <nav class="toc">
    <h4>Table of Contents</h4>
    {{toc}}
  </nav>

  {{content}}

  {{#parentIndex}}
  <div style="margin-top:40px;padding-top:16px;border-top:1px dashed var(--border)">
    <a href="{{parentIndex}}" style="font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> {{parentTitle}}
    </a>
  </div>
  {{/parentIndex}}

  <div class="footer">Copyright(c) 2026 U PLEAT</div>
</div>

<script>
// Theme
const html=document.documentElement,tBtn=document.getElementById('theme-toggle'),tLab=document.getElementById('theme-label'),tIcon=document.getElementById('theme-icon');
const THEMES=['light','dark','colorblind'],THEME_NAMES={light:'라이트',dark:'다크',colorblind:'색각 보정'},THEME_ICONS={light:'fa-sun',dark:'fa-moon',colorblind:'fa-eye'};
function currentTheme(){return html.classList.contains('dark')?'dark':html.classList.contains('colorblind')?'colorblind':'light';}
function syncTheme(){const current=currentTheme(),next=THEMES[(THEMES.indexOf(current)+1)%THEMES.length];tLab.textContent=THEME_NAMES[next]+' 모드';tBtn.setAttribute('aria-label',THEME_NAMES[next]+' 모드로 전환');tBtn.title='현재 테마: '+THEME_NAMES[current];tIcon.className='fa-solid '+THEME_ICONS[next];}
function applyTheme(theme,persist=true){html.classList.remove('dark','colorblind');if(theme!=='light')html.classList.add(theme);html.dataset.theme=theme;if(persist)localStorage.setItem('theme',theme);syncTheme();}
const savedTheme=localStorage.getItem('theme');
applyTheme(THEMES.includes(savedTheme)?savedTheme:window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light',false);
tBtn.addEventListener('click',()=>{const current=currentTheme();applyTheme(THEMES[(THEMES.indexOf(current)+1)%THEMES.length]);});
// Content width switcher — 1080 / 1440 / 1920
const WIDTHS=['1080px','1440px','1920px'],LABELS=['본문 넓게','본문 더 넓게','본문 좁게'];
let wIdx=Math.max(0,WIDTHS.indexOf(localStorage.getItem('docWidth')||'1080px'));
const wBtn=document.getElementById('width-toggle'),wLab=document.getElementById('width-label');
function applyWidth(){document.documentElement.style.setProperty('--content-w',WIDTHS[wIdx]);wLab.textContent=LABELS[wIdx];localStorage.setItem('docWidth',WIDTHS[wIdx]);}
applyWidth();
wBtn.addEventListener('click',()=>{wIdx=(wIdx+1)%WIDTHS.length;applyWidth();});
// Scroll to top
document.getElementById('to-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
</script>
</body>
</html>
