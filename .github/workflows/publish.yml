name: Publish to u-maker (public)

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare distribution
        run: |
          rm -rf .github .claude .u-maker evals deploy_local.sh deploy_local.bat
          rm -f .DS_Store
          cat > .gitignore << 'EOF'
          .DS_Store
          .u-maker/
          .claude/
          node_modules/
          *.log
          __pycache__
          EOF
          sed -i 's/^          //' .gitignore

      - name: Push to public repos
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          UPLEAT_PUBLISH_TOKEN: ${{ secrets.UPLEAT_PUBLISH_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${TAG}" --allow-empty
          git tag -f "${TAG}"

          # 1. thinoo-v2/u-maker-production
          git remote add public https://x-access-token:${PUBLISH_TOKEN}@github.com/thinoo-v2/u-maker-production.git
          git push public HEAD:main --force
          git push public "${TAG}" --force

          # 2. upleat-ax/u-maker-plugin
          git remote add upleat https://x-access-token:${UPLEAT_PUBLISH_TOKEN}@github.com/upleat-ax/u-maker-plugin.git
          git push upleat HEAD:refs/heads/main --force
          git push upleat "${TAG}" --force
