name: Publish to u-maker (public)

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create plugin zip
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Package plugin files into zip (exclude dev/CI files)
          zip -r "/tmp/u-maker-plugin-${TAG}.zip" \
            .claude-plugin/ \
            skills/ \
            agents/ \
            _refer/ \
            templates/ \
            scripts/ \
            lib/ \
            hooks/ \
            deploy_local.sh \
            deploy_local.bat \
            README.md \
            GET_STARTED.md \
            -x "*.DS_Store" "*__pycache__*" "*.pyc"

      - name: Create Release on private repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "${TAG}" \
            "/tmp/u-maker-plugin-${TAG}.zip" \
            --title "u-maker ${TAG}" \
            --notes "Release ${TAG}" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Prepare public repo content
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Save files for public repos
          cp README.md /tmp/README.md
          cp install.sh /tmp/install.sh
          cp install.bat /tmp/install.bat

          # Remove everything
          git rm -rf . 2>/dev/null || true
          git clean -fdx

          # Restore only public-facing files
          cp /tmp/README.md README.md
          cp /tmp/install.sh install.sh
          cp /tmp/install.bat install.bat

          cat > .gitignore << 'GITIGNORE'
          .DS_Store
          .u-maker/
          .claude/
          node_modules/
          *.log
          __pycache__
          GITIGNORE
          sed -i 's/^          //' .gitignore

      - name: Push to public repos
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          UPLEAT_PUBLISH_TOKEN: ${{ secrets.UPLEAT_PUBLISH_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${TAG}" --allow-empty
          git tag -f "${TAG}"

          # 1. thinoo-v2/u-maker-production
          git remote add public https://x-access-token:${PUBLISH_TOKEN}@github.com/thinoo-v2/u-maker-production.git
          git push public HEAD:main --force
          git push public "${TAG}" --force

          # 2. upleat-ax/u-maker-plugin
          git remote add upleat https://x-access-token:${UPLEAT_PUBLISH_TOKEN}@github.com/upleat-ax/u-maker-plugin.git
          git push upleat HEAD:refs/heads/main --force
          git push upleat "${TAG}" --force

      - name: Create Releases on public repos
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          UPLEAT_PUBLISH_TOKEN: ${{ secrets.UPLEAT_PUBLISH_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ZIP="/tmp/u-maker-plugin-${TAG}.zip"
          NOTES="## u-maker ${TAG}

          ### Install

          **macOS / Linux:**
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/upleat-ax/u-maker-plugin/main/install.sh | bash
          \`\`\`

          **Windows (PowerShell):**
          \`\`\`powershell
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/upleat-ax/u-maker-plugin/main/install.bat -OutFile install.bat; .\\install.bat; Remove-Item install.bat
          \`\`\`"

          # Remove leading whitespace from NOTES
          NOTES=$(echo "$NOTES" | sed 's/^          //')

          # thinoo-v2/u-maker-production
          GH_TOKEN="${PUBLISH_TOKEN}" gh release create "${TAG}" \
            "${ZIP}" \
            --title "u-maker ${TAG}" \
            --notes "${NOTES}" \
            --repo "thinoo-v2/u-maker-production" 2>/dev/null || \
          GH_TOKEN="${PUBLISH_TOKEN}" gh release upload "${TAG}" \
            "${ZIP}" --clobber \
            --repo "thinoo-v2/u-maker-production" 2>/dev/null || true

          # upleat-ax/u-maker-plugin
          GH_TOKEN="${UPLEAT_PUBLISH_TOKEN}" gh release create "${TAG}" \
            "${ZIP}" \
            --title "u-maker ${TAG}" \
            --notes "${NOTES}" \
            --repo "upleat-ax/u-maker-plugin" 2>/dev/null || \
          GH_TOKEN="${UPLEAT_PUBLISH_TOKEN}" gh release upload "${TAG}" \
            "${ZIP}" --clobber \
            --repo "upleat-ax/u-maker-plugin" 2>/dev/null || true
