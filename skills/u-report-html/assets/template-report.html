<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
<style>
/* ============================================================================
   u-maker document theme — _meta/theme/u-doc-theme.css 에서 인라인 복사
   레이어: L0 tokens · L1 prose · L2b report shell · L3 components · L4 chrome
   색·서체·문단 리듬은 여기서 새로 정의하지 않는다 (테마 SSoT = html-engine § 0)
   ========================================================================== */

/* ---- L0. Tokens ---- */
:root{
  --bg:#fff;--panel:#f2f5f8;--soft:#f8fafc;--surface:#fff;
  --fg:#111827;--muted:#4b5563;--dim:#6b7280;--border:#e2e8f0;
  --accent:#3d6fa5;--accent-strong:#2c5580;--accent-soft:#a8c4e0;
  --accent-bg:#eef3f9;--accent-line:#b8cee4;--hi:#dbe7f5;
  --ok-bg:#eef3f9;--ok-fg:#2c5580;--bad-bg:#f9f0ef;--bad-fg:#b91c1c;
  --warn-bg:#f7f0ea;--warn-fg:#c2410c;
  --plan:#2c5580;--build:#3d6fa5;--gate:#64748b;--deploy:#334155;
  --depth-1:#2c5580;--depth-2:#3d6fa5;--depth-3:#5b8db8;--depth-4:#8fb3d0;--depth-5:#b8cee4;
  --gray-1:#334155;--gray-2:#64748b;--gray-3:#94a3b8;--gray-4:#cbd5e1;
  --sb-w:260px;--sb-bg:#143050;--sb-deep:#0e2138;--sb-fg:#f8fafc;--sb-muted:#c6d0df;--sb-dim:#8fa0b8;
  --sb-accent:#a8c4e0;--sb-line:rgba(168,196,224,.14);--sb-hover:rgba(168,196,224,.08);
  --sb-active:rgba(168,196,224,.16);--sb-chip:rgba(168,196,224,.12);
  --shadow:0 1px 2px rgba(17,17,17,.05);--shadow-lg:0 4px 14px rgba(17,17,17,.13);
  --radius:14px;--radius-sm:10px;
  --content-w:1080px;--glance-w:320px;
}
.dark{
  color-scheme:dark;
  --bg:#0f1319;--panel:#161c24;--soft:#131920;--surface:#131920;
  --fg:#e6edf3;--muted:#9aa7b6;--dim:#7d8998;--border:#242c37;
  --accent:#8ab4e0;--accent-strong:#a8c4e0;--accent-soft:#a8c4e0;
  --accent-bg:#172230;--accent-line:#2c435c;--hi:#20344c;
  --ok-bg:#172230;--ok-fg:#a8c4e0;--bad-bg:#261a18;--bad-fg:#fca5a5;
  --warn-bg:#26201a;--warn-fg:#d9b48c;
  --plan:#6d9dcb;--build:#8ab4e0;--gate:#94a3b8;--deploy:#cbd5e1;
  --depth-1:#a8c4e0;--depth-2:#8ab4e0;--depth-3:#6d9dcb;--depth-4:#4d7ba8;--depth-5:#35597e;
  --gray-1:#cbd5e1;--gray-2:#94a3b8;--gray-3:#64748b;--gray-4:#3f4c5c;
  --sb-bg:#0f2337;--sb-deep:#091724;
  --shadow:0 1px 2px rgba(0,0,0,.45);--shadow-lg:0 4px 14px rgba(0,0,0,.55);
}
.colorblind{
  color-scheme:light;
  --bg:#fff;--panel:#f1f5f7;--soft:#f7fafb;--surface:#fff;
  --fg:#1a1a1a;--muted:#3f4a54;--dim:#56616a;--border:#7c8993;
  --accent:#0072b2;--accent-strong:#005a8d;--accent-soft:#56b4e9;
  --accent-bg:#e6f3f8;--accent-line:#56b4e9;--hi:#d7eef7;
  --ok-bg:#e6f3f8;--ok-fg:#005a8d;--bad-bg:#fff0e8;--bad-fg:#9f4500;
  --warn-bg:#fff4d6;--warn-fg:#704700;
  --plan:#0072b2;--build:#8a5700;--gate:#8f4a80;--deploy:#1a1a1a;
  --depth-1:#005a8d;--depth-2:#0072b2;--depth-3:#56b4e9;--depth-4:#8a5700;--depth-5:#8f4a80;
  --gray-1:#1a1a1a;--gray-2:#3f4a54;--gray-3:#56616a;--gray-4:#7c8993;
  --sb-bg:#102a43;--sb-deep:#0b1f33;--sb-fg:#fff;--sb-muted:#d8e7f2;--sb-dim:#b9cbd8;
  --sb-accent:#56b4e9;--sb-line:rgba(86,180,233,.28);--sb-hover:rgba(86,180,233,.12);
  --sb-active:rgba(86,180,233,.22);--sb-chip:rgba(86,180,233,.18);
  --shadow:0 1px 3px rgba(26,26,26,.12);--shadow-lg:0 4px 14px rgba(26,26,26,.2);
}
.colorblind :focus-visible{outline:3px solid #8a5700;outline-offset:3px}

/* ---- L1. Base + prose ---- */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
     color:var(--fg);font-size:14.5px;line-height:1.8;letter-spacing:-0.005em;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.hero{border-bottom:1px solid var(--fg);padding-bottom:20px;margin-bottom:28px}
.hero h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-0.5px;line-height:1.35}
.hero .sub{color:var(--muted);margin-top:10px;font-size:13px;line-height:1.9}
/* 형광펜 — 제목·본문의 핵심어. 글자 아랫부분만 덮어 마커로 그은 느낌을 낸다.
   제목은 .highlight / .qword, 본문 인라인 키워드는 <mark> 또는 .hl 을 쓴다. */
.hero .highlight,.qword,mark,.hl{
  background:linear-gradient(to top,var(--hi) 0,var(--hi) 62%,transparent 62%);
  color:var(--fg);padding:0 5px;border-radius:2px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
mark,.hl{font-weight:600}
h1{font-size:27px;font-weight:700;letter-spacing:-0.5px;line-height:1.35;margin:0 0 10px}
h2{font-size:17px;font-weight:700;line-height:1.5;margin:0 0 6px}
h3{font-size:14.5px;font-weight:800;margin:22px 0 6px;line-height:1.6}
h4{font-size:13px;font-weight:700;margin:16px 0 4px;line-height:1.6}
h2+p,h3+p{margin-top:0}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:20px}
li{margin:2px 0}
section,.blk{margin-bottom:54px}
.qword{margin-right:6px}
.section-hint{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.85}
.section-hint b{color:var(--fg)}
.thesis{background:var(--fg);color:#fff;border-radius:14px;padding:22px 26px;font-size:16px;line-height:2.0;margin-bottom:16px}
.thesis b{color:var(--accent-soft)}
.thesis .k{font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;color:#9ca3af;display:block;margin-bottom:6px}
.dark .thesis{background:#080a0e}
.note,.flowfoot,.annotation{font-size:12px;color:var(--muted);line-height:1.8;border-top:1px dashed var(--border);padding-top:10px;margin-top:14px}
.note b,.flowfoot b,.annotation strong{color:var(--fg)}
.panel{background:var(--panel);border-radius:var(--radius);padding:22px 20px;margin:16px 0;overflow-x:auto}
.card{background:var(--surface);border-radius:11px;box-shadow:var(--shadow);padding:13px 15px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 11px;line-height:1.6;background:var(--panel);color:#374151}
.dark .tag{color:var(--muted)}
.tag.good{background:var(--ok-bg);color:var(--ok-fg)}
.tag.bad{background:var(--bad-bg);color:var(--bad-fg)}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.meta-bar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 26px;font-size:11.5px;color:var(--muted)}
.meta-bar span{background:var(--panel);padding:3px 11px;border-radius:999px;font-weight:700}
.toc{background:var(--panel);border-radius:var(--radius);padding:18px 22px;margin:0 0 40px}
.toc h4{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);margin:0 0 8px}
.toc ul{list-style:none;padding-left:0;margin:0}
.toc li{font-size:12.5px;padding:2px 0;line-height:1.7}
.toc ul ul{padding-left:14px}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.5px;line-height:1.7}
th{background:var(--panel);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);color:var(--fg)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--muted)}
td strong,td b{color:var(--fg)}
tbody tr:hover td{background:var(--soft)}
.panel table{background:var(--surface);border-radius:12px;margin:0}
.panel th{background:var(--surface);color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.9px}
.panel tbody tr:last-child td{border-bottom:0}
.panel tbody tr:hover td{background:var(--accent-bg)}
code{background:var(--panel);padding:2px 6px;border-radius:4px;font-size:12px;font-family:ui-monospace,'JetBrains Mono','Fira Code',monospace}
pre{background:#111827;color:#e2e8f0;padding:16px 18px;border-radius:12px;overflow-x:auto;font-size:12px;line-height:1.7}
pre code{background:none;padding:0;color:inherit}
blockquote{margin:14px 0;padding:14px 18px;background:var(--accent-bg);border-radius:12px;color:var(--muted);font-size:13px}
hr{border:0;border-top:1px dashed var(--border);margin:26px 0}
svg{max-width:100%}
figure{margin:16px 0}
figcaption{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:9px;text-align:center}
.mermaid{margin:16px 0;text-align:center}
.mermaid-wrapper{background:#fff;border-radius:12px;padding:16px;margin:16px 0}
.footer,.report-footer{padding-top:16px;margin-top:40px;border-top:1px solid var(--border);
  font-size:12px;color:var(--muted);line-height:1.95;text-align:center}

/* ---- L2b. Shell: 3열 리포트 ---- */
.layout{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;width:var(--sb-w);height:100vh;z-index:100;
  background:linear-gradient(180deg,var(--sb-bg),var(--sb-deep));color:var(--sb-fg);
  display:flex;flex-direction:column;overflow:hidden;padding-bottom:51px}
.sidebar-header{padding:26px 22px 18px;border-bottom:1px solid var(--sb-line)}
.sidebar-header h2{font-size:15px;font-weight:700;color:var(--sb-fg);letter-spacing:-0.3px;line-height:1.45;margin:0}
.sidebar-header p{font-size:11.5px;color:var(--sb-muted);margin:7px 0 0;line-height:1.7}
.sidebar-nav{list-style:none;flex:1;overflow-y:auto;padding:10px 0;margin:0}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--sb-chip);border-radius:2px}
.sidebar-nav li{margin:0}
.sidebar-nav li a{display:flex;align-items:center;gap:11px;padding:9px 22px;font-size:13px;
  color:var(--sb-muted);text-decoration:none;line-height:1.6;transition:background .15s,color .15s}
.sidebar-nav li a:hover{background:var(--sb-hover);color:var(--sb-fg);text-decoration:none}
.sidebar-nav li a.active{background:var(--sb-active);color:var(--sb-fg);font-weight:700}
.nav-icon{flex:0 0 auto;min-width:34px;padding:3px 7px;border-radius:8px;background:var(--sb-chip);
  color:var(--sb-accent);text-align:center;font-family:ui-monospace,'JetBrains Mono','Fira Code',monospace;
  font-size:11.5px;font-weight:700;line-height:1.6}
.sidebar-nav li a.active .nav-icon{color:var(--sb-fg)}
.sidebar-nav li a .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-count{flex:0 0 auto;margin-left:auto;font-size:10.5px;font-weight:700;background:var(--sb-chip);
  color:var(--sb-accent);border-radius:999px;padding:1px 8px;line-height:1.7}
.sidebar-footer{padding:16px 22px;border-top:1px solid var(--sb-line);font-size:11px;color:var(--sb-dim);line-height:1.8}
/* 조작 버튼은 본문 위에 떠 있지 않고 사이드바 하단 면에 임베딩한다 (눈에 띄지 않게) */
.sidebar-tools{position:fixed;left:0;bottom:0;width:var(--sb-w);z-index:110;
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:9px 14px;
  background:var(--sb-deep);border-top:1px solid var(--sb-line)}
.sb-tool{display:flex;align-items:center;justify-content:center;padding:8px 0;border:0;border-radius:8px;
  background:var(--sb-chip);color:var(--sb-muted);font:600 11px/1.5 inherit;cursor:pointer}
.sb-tool:hover{background:var(--sb-hover);color:var(--sb-fg)}
.sb-tool i{font-size:12.5px}
.sb-tool:focus-visible{outline:2px solid var(--sb-accent);outline-offset:2px}
.main-content{flex:1;margin-left:var(--sb-w);margin-right:var(--glance-w);padding:36px 44px 110px;transition:margin-right .25s}
.article-wrap{max-width:var(--content-w);margin:0 auto;transition:max-width .25s}
body.glance-off .main-content{margin-right:0}
.glance{position:fixed;top:0;right:0;width:var(--glance-w);height:100vh;z-index:90;
  background:var(--surface);border-left:1px solid var(--border);
  padding:26px 20px 32px;overflow-y:auto;transition:transform .25s}
body.glance-off .glance{transform:translateX(100%)}
.glance-head{display:flex;align-items:center;gap:8px;padding-bottom:14px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.glance-head .g-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.glance-title{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.glance-block{padding:15px 0;border-bottom:1px solid var(--border)}
.glance-block:last-child{border-bottom:none}
.glance-block h3{font-size:12.5px;font-weight:700;margin:0 0 9px}
.glance-block h3 a{color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:6px}
.glance-block h3 a:hover{color:var(--accent);text-decoration:none}
.gb-ico{font-size:13px;width:16px;text-align:center;color:var(--accent)}
.gb-count{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--panel);color:var(--muted);padding:1px 8px;border-radius:999px}
.gb-count.ok,.gb-count.green{background:var(--ok-bg);color:var(--ok-fg)}
.gb-count.warn,.gb-count.yellow{background:var(--warn-bg);color:var(--warn-fg)}
.gb-count.bad,.gb-count.red{background:var(--bad-bg);color:var(--bad-fg)}
.gb-count.neutral,.gb-count.purple{background:var(--panel);color:var(--gray-2)}
.glance ul{list-style:none;display:flex;flex-direction:column;gap:8px;padding:0;margin:0}
.glance-summary li{position:relative;padding-left:13px;font-size:12.5px;line-height:1.55;color:var(--fg);margin:0}
.glance-summary li::before{content:'•';position:absolute;left:1px;color:var(--accent);font-weight:800}
.glance-list li{position:relative;padding-left:13px;font-size:12px;line-height:1.5;color:var(--muted);margin:0}
.glance-list li::before{content:'–';position:absolute;left:2px;color:var(--dim)}
.glance-empty{font-size:12px;color:var(--dim);font-style:italic}

/* ---- L3. Components ---- */
.simple-list{list-style:none;margin:10px 0 16px;padding:0}
.simple-list>li,.simple-list-row{margin:0;padding:12px 8px;border:0;border-bottom:1px solid var(--border);
  border-radius:0;background:transparent;box-shadow:none}
.simple-list>li{display:flex;align-items:baseline;gap:12px}
.simple-list>.simple-list-row{display:grid;grid-template-columns:minmax(140px,.75fr) minmax(0,1fr) auto;align-items:baseline;gap:12px}
.simple-list>li:last-child,.simple-list-row:last-child{border-bottom:0}
.simple-list>.is-current{background:var(--accent-bg);font-weight:700}
.simple-list--numbered{counter-reset:simple-list}
.simple-list--numbered>li{counter-increment:simple-list}
.simple-list--numbered>li::before{content:counter(simple-list,decimal-leading-zero);flex:0 0 2.2em;color:var(--accent);
  font:700 12px/1.8 ui-monospace,'JetBrains Mono','Fira Code',monospace}
.simple-list .list-label{font-weight:700;color:var(--fg)}
.simple-list .list-detail{min-width:0;color:var(--muted)}
.simple-list .list-meta{color:var(--dim);font:600 12px/1.8 ui-monospace,'JetBrains Mono','Fira Code',monospace;white-space:nowrap}
.decision-list{list-style:none;margin:12px 0 18px;padding:0}
.decision-list li{display:flex;align-items:flex-start;gap:12px;margin:0;padding:12px 8px;
  border-bottom:1px solid var(--border);font-size:13.5px;line-height:1.75}
.decision-list li:last-child{border-bottom:0}
.decision-check{flex:0 0 auto;color:var(--accent);font-weight:800;font-size:13px;margin-top:2px}
.decision-body{flex:1;min-width:0}
.data-table-wrap{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin:16px 0 28px}
.data-table{width:100%;border-collapse:collapse;font-size:13px;margin:0}
.data-table thead th{background:var(--soft);color:var(--dim);padding:10px 16px;text-align:left;
  font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.9px;
  border-bottom:1px solid var(--border);white-space:nowrap}
.data-table tbody td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.7;color:var(--muted)}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr:hover td{background:var(--accent-bg)}
.data-table .col-term{font-weight:700;color:var(--fg);white-space:nowrap}
.data-table .col-eng{color:var(--muted);font-size:12.5px}
.data-table .col-abbr{font-family:ui-monospace,'JetBrains Mono','Fira Code',monospace;font-size:12px;font-weight:600;color:var(--accent)}
.data-table .col-alias{color:var(--dim);font-size:12.5px}
.data-table .col-desc{color:var(--muted);font-size:13px}
.data-table .empty,.empty{color:var(--dim)}
.feature-cards{display:grid;grid-template-columns:1fr;gap:16px;margin:18px 0}
.feature-cards.cols-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.feature-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow)}
.feature-card.accent,.feature-card.blue{border-color:var(--accent-line);background:var(--accent-bg)}
.feature-card.ok,.feature-card.green{border-color:var(--accent-line);background:var(--ok-bg)}
.feature-card.warn,.feature-card.yellow{border-color:var(--warn-fg);background:var(--warn-bg)}
.feature-card.bad,.feature-card.red{border-color:var(--bad-fg);background:var(--bad-bg)}
.feature-card.neutral,.feature-card.purple{border-color:var(--gray-3);background:var(--panel)}
.feature-card h3{font-size:14.5px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.feature-card h3 .fa-solid,.feature-card h3 .fa-regular,.feature-card h3 .fa-brands{color:var(--accent);font-size:13.5px}
.feature-card p,.feature-card ul{font-size:13.5px;color:var(--muted);line-height:1.8}
.feature-card p:last-child,.feature-card ul:last-child{margin-bottom:0}
.feature-card ul{margin:8px 0 0;padding-left:18px}
.highlight-box{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:var(--radius-sm);
  padding:16px 20px;margin:16px 0;font-size:13.5px;line-height:1.8;color:var(--fg)}
.highlight-box strong{color:var(--accent-strong)}
.highlight-box ul{margin:8px 0 0;padding-left:18px}
.highlight-box ul li{margin-bottom:4px;color:var(--muted)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px;vertical-align:middle}
.badge-blue,.badge-accent{background:var(--accent-bg);color:var(--accent-strong)}
.badge-ok,.badge-green{background:var(--ok-bg);color:var(--ok-fg)}
.badge-warn,.badge-yellow{background:var(--warn-bg);color:var(--warn-fg)}
.badge-bad,.badge-red{background:var(--bad-bg);color:var(--bad-fg)}
.badge-neutral,.badge-purple,.badge-gray{background:var(--panel);color:var(--gray-2)}
.dark .badge-neutral,.dark .badge-purple,.dark .badge-gray{color:var(--muted)}
.timeline{position:relative;margin:18px 0;padding-left:28px}
.timeline::before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:18px}
.timeline-item::before{content:'';position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.timeline-item .timestamp{font-family:ui-monospace,'JetBrains Mono','Fira Code',monospace;font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.3px}
.timeline-item p{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.standard-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin:16px 0}
.standard-card-header{background:var(--panel);padding:15px 22px;border-bottom:1px solid var(--border)}
.standard-card-header h3{font-size:13.5px;font-weight:800;color:var(--fg);margin:0}
.standard-list{padding:4px 0}
.standard-item{display:flex;align-items:center;gap:16px;padding:10px 22px;border-bottom:1px solid var(--border)}
.standard-item:last-child{border-bottom:none}
.standard-term{font-weight:800;font-size:13.5px;color:var(--accent-strong);min-width:100px}
.standard-arrow{flex-shrink:0;color:var(--dim);font-size:13px}
.standard-aliases{display:flex;gap:6px;flex-wrap:wrap}
.alias-tag{padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;background:var(--panel);color:var(--dim);
  text-decoration:line-through;text-decoration-color:var(--gray-3)}
.diagram{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:22px;margin:18px 0 26px;overflow-x:auto}
.diagram svg{display:block;max-width:100%;height:auto;margin:0 auto}
.diagram-caption{margin-top:12px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7}
/* 인라인 SVG 색은 하드코딩 hex 대신 이 클래스로 (3모드 자동 대응) */
.svg-surface{fill:var(--surface)}
.svg-panel{fill:var(--panel)}
.svg-accent-bg{fill:var(--accent-bg)}
.svg-accent{fill:var(--accent)}
.svg-ink{fill:var(--fg)}
.svg-muted{fill:var(--muted)}
.svg-warn{fill:var(--warn-fg)}
.svg-bad{fill:var(--bad-fg)}
.svg-line{fill:none;stroke:var(--gray-2)}
.svg-border{fill:none;stroke:var(--border)}
.svg-stroke-accent{fill:none;stroke:var(--accent)}
.svg-marker{fill:var(--gray-2);stroke:none}
.flow-diagram{display:flex;align-items:stretch;flex-wrap:wrap;gap:10px}
.flow-diagram.vertical{flex-direction:column}
.flow-node{flex:1 1 130px;min-width:130px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 16px;text-align:center;font-size:13.5px;font-weight:700;color:var(--fg);
  display:flex;flex-direction:column;justify-content:center;gap:4px}
.flow-diagram.vertical .flow-node{flex:0 0 auto}
.flow-node .flow-sub{font-size:12px;font-weight:500;color:var(--muted)}
.flow-node.accent{border-color:var(--accent-line);background:var(--accent-bg);color:var(--accent-strong)}
.flow-node.ok,.flow-node.green{border-color:var(--accent-line);background:var(--ok-bg);color:var(--ok-fg)}
.flow-node.warn,.flow-node.yellow{border-color:var(--warn-fg);background:var(--warn-bg);color:var(--warn-fg)}
.flow-node.bad,.flow-node.red{border-color:var(--bad-fg);background:var(--bad-bg);color:var(--bad-fg)}
.flow-node.neutral,.flow-node.purple{border-color:var(--gray-3);background:var(--panel);color:var(--gray-1)}
.flow-arrow{flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:18px;font-weight:700}

/* ---- L4. Chrome ---- */
.progress-bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:300;transition:width .1s linear}
.fab-stack{position:fixed;right:22px;bottom:26px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab-stack.with-glance{right:calc(var(--glance-w) + 22px);transition:right .25s}
body.glance-off .fab-stack.with-glance{right:22px}
.fab{background:#fff;color:var(--fg);border:0;border-radius:999px;padding:10px 18px;font:700 12.5px/1.4 inherit;
  letter-spacing:-0.005em;box-shadow:var(--shadow-lg);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.fab:hover{background:var(--panel)}
.dark .fab{background:#161c24;color:var(--fg)}
.fab-round{width:46px;height:46px;padding:0;justify-content:center;background:var(--accent);color:#fff;font-size:15px;
  box-shadow:0 4px 14px rgba(61,111,165,.38)}
.dark .fab-round{background:var(--accent);color:#0f1319}
@media (max-width:1200px){
  .glance{transform:translateX(100%)}
  .main-content{margin-right:0}
  .fab-stack.with-glance{right:22px}
}
@media (max-width:900px){
  .sidebar{display:none}
  .main-content{margin-left:0;padding:24px 20px 96px}
  .sidebar-tools{left:auto;right:14px;bottom:14px;width:auto;grid-template-columns:repeat(4,36px);
    background:var(--panel);border-top:0;border-radius:999px;padding:8px 10px;box-shadow:var(--shadow-lg)}
  .sb-tool{background:transparent;color:var(--muted)}
  .sb-tool:hover{background:var(--surface);color:var(--fg)}
}
@media (max-width:760px){
  .hero h1,h1{font-size:22px}
  .simple-list>.simple-list-row{grid-template-columns:1fr auto;gap:2px 10px}
  .simple-list-row .list-detail{grid-column:1/-1}
  .fab-stack{right:14px;bottom:16px}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
@media print{
  @page{size:A4;margin:12mm}
  body{font-size:12px}
  .sidebar,.glance,.sidebar-tools,.fab-stack,.progress-bar{display:none !important}
  .main-content{margin-left:0;margin-right:0;padding:0}
  .article-wrap{max-width:100%}
  .panel,.card,.feature-card,.data-table-wrap,.standard-card,table,figure,.diagram{page-break-inside:avoid;break-inside:avoid}
  h2,h3,.section-hint{page-break-after:avoid;break-after:avoid}
  .thesis,.tag,.qword,.badge,.highlight-box,.flow-node{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .diagram{overflow:visible}
}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="layout">

  <!-- ──────── SIDEBAR (좌측 목차) ────────
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>문서 제목 (짧게)</h2>
      <p>문서 유형 설명</p>
    </div>
    <ul class="sidebar-nav">
      <li><a href="#section1"><span class="nav-icon">01</span><span class="label">섹션 제목</span><span class="sidebar-count">N</span></a></li>
    </ul>
    <div class="sidebar-footer">Copyright(c) 2026 U PLEAT</div>
  </aside>
  -->
  {{SIDEBAR}}

  <!-- ──────── MAIN ──────── -->
  <div class="main-content">
    <div class="article-wrap">

      {{CONTENT}}

      <div class="footer">Copyright(c) 2026 U PLEAT</div>

    </div>
  </div>

  <!-- ──────── GLANCE RAIL (우측 한눈 요약) ────────
  핵심 요약 3~5줄 + 주요 항목/핵심 포인트(본문 앵커 링크). 각 줄은 한 줄 요약(길게 쓰지 말 것).
  아이콘은 Font Awesome(fa-solid), 빈 블록은 <li class="glance-empty">없음</li>.
  <aside class="glance">
    <div class="glance-head"><span class="g-dot"></span><span class="glance-title">한눈에 보기</span></div>
    <section class="glance-block">
      <h3><i class="gb-ico fa-solid fa-thumbtack" aria-hidden="true"></i> 핵심 요약</h3>
      <ul class="glance-summary"><li>문서 핵심 한 줄</li></ul>
    </section>
    <section class="glance-block">
      <h3><a href="#section1"><i class="gb-ico fa-solid fa-list-ul" aria-hidden="true"></i> 주요 항목 <span class="gb-count">N</span></a></h3>
      <ul class="glance-list"><li>항목 한 줄</li></ul>
    </section>
    <section class="glance-block">
      <h3><a href="#section2"><i class="gb-ico fa-solid fa-circle-check" aria-hidden="true"></i> 핵심 포인트 <span class="gb-count ok">N</span></a></h3>
      <ul class="glance-list"><li>포인트 한 줄</li></ul>
    </section>
  </aside>
  -->
  {{GLANCE}}
</div>

<!-- 좌측 사이드바 하단에 임베딩된 컨트롤: 테마 · 본문 폭 · 요약 레일 · 맨 위로 -->
<div class="sidebar-tools">
  <button class="sb-tool" id="theme-toggle" aria-label="다크 모드로 전환" title="테마 전환"><i class="fa-solid fa-moon" id="theme-icon" aria-hidden="true"></i></button>
  <button class="sb-tool" id="width-toggle" aria-label="본문 폭 전환" title="본문 폭 전환"><i class="fa-solid fa-arrows-left-right" aria-hidden="true"></i></button>
  <button class="sb-tool" id="glance-toggle" aria-expanded="true" aria-controls="glance" aria-label="요약 패널 접기" title="요약 패널 접기"><i class="fa-solid fa-table-columns" aria-hidden="true"></i></button>
  <button class="sb-tool" id="to-top" aria-label="맨 위로" title="맨 위로"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
</div>

<script>
const REDUCED_MOTION=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
// 1) 테마 — light / dark / colorblind 순환
const html=document.documentElement,tBtn=document.getElementById('theme-toggle'),tIcon=document.getElementById('theme-icon');
const THEMES=['light','dark','colorblind'],THEME_NAMES={light:'라이트',dark:'다크',colorblind:'색각 보정'},THEME_ICONS={light:'fa-sun',dark:'fa-moon',colorblind:'fa-eye'};
function currentTheme(){return html.classList.contains('dark')?'dark':html.classList.contains('colorblind')?'colorblind':'light';}
function syncTheme(){const c=currentTheme(),n=THEMES[(THEMES.indexOf(c)+1)%THEMES.length];const s=THEME_NAMES[n]+' 모드로 전환';tBtn.setAttribute('aria-label',s);tBtn.title='현재 '+THEME_NAMES[c]+' 모드 — '+s;tIcon.className='fa-solid '+THEME_ICONS[n];}
function applyTheme(t,persist=true){html.classList.remove('dark','colorblind');if(t!=='light')html.classList.add(t);html.dataset.theme=t;if(persist)localStorage.setItem('theme',t);syncTheme();}
const savedTheme=localStorage.getItem('theme');
applyTheme(THEMES.includes(savedTheme)?savedTheme:window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light',false);
tBtn.addEventListener('click',()=>{applyTheme(THEMES[(THEMES.indexOf(currentTheme())+1)%THEMES.length]);});

// 2) 본문 폭 — 1080 / 1440 / 1920 순환
const WIDTHS=['1080px','1440px','1920px'],WLABELS=['넓게','더 넓게','좁게'];
let wIdx=Math.max(0,WIDTHS.indexOf(localStorage.getItem('docWidth')||'1080px'));
const wBtn=document.getElementById('width-toggle');
function applyWidth(){html.style.setProperty('--content-w',WIDTHS[wIdx]);const s='본문 폭 전환 — 현재 '+WIDTHS[wIdx];wBtn.setAttribute('aria-label',s);wBtn.title=s;localStorage.setItem('docWidth',WIDTHS[wIdx]);}
applyWidth();
wBtn.addEventListener('click',()=>{wIdx=(wIdx+1)%WIDTHS.length;applyWidth();});

// 3) 글랜스 레일 접기/펼치기
const gBtn=document.getElementById('glance-toggle');
function applyGlance(off,persist=true){document.body.classList.toggle('glance-off',off);const s=off?'요약 패널 펼치기':'요약 패널 접기';gBtn.setAttribute('aria-label',s);gBtn.title=s;gBtn.setAttribute('aria-expanded',String(!off));if(persist)localStorage.setItem('glanceOff',off?'1':'0');}
applyGlance(localStorage.getItem('glanceOff')==='1',false);
gBtn.addEventListener('click',()=>{applyGlance(!document.body.classList.contains('glance-off'));});

// 4) 맨 위로
document.getElementById('to-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:REDUCED_MOTION?'auto':'smooth'}));

// 5) 읽기 진행률
const progressBar=document.getElementById('progressBar');
function updateProgress(){const h=document.documentElement,max=h.scrollHeight-h.clientHeight;progressBar.style.width=(max>0?(h.scrollTop/max)*100:0)+'%';}
window.addEventListener('scroll',updateProgress,{passive:true});
window.addEventListener('load',updateProgress);

// 6) 사이드바 활성 추적 (섹션은 .blk[id] 또는 .section-divider[id])
const sections=document.querySelectorAll('.blk[id],.section-divider[id]');
const navLinks=document.querySelectorAll('.sidebar-nav a');
function updateActiveNav(){
  let current='';
  sections.forEach(s=>{if(s.getBoundingClientRect().top<=120)current=s.id;});
  navLinks.forEach(l=>{l.classList.toggle('active',l.getAttribute('href')==='#'+current);});
}
window.addEventListener('scroll',updateActiveNav,{passive:true});
window.addEventListener('load',updateActiveNav);
</script>
</body>
</html>
