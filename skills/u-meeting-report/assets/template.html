<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --sidebar-bg: #1e2432;
    --sidebar-text: #b0b8c9;
    --sidebar-active: #ffffff;
    --sidebar-accent: #4f8cff;
    --text: #1e2432;
    --text-secondary: #5a6376;
    --border: #e2e5ea;
    --accent: #4f8cff;
    --accent-light: #eaf1ff;
    --green: #22c55e;
    --green-light: #ecfdf5;
    --red: #ef4444;
    --red-light: #fef2f2;
    --yellow: #f59e0b;
    --yellow-light: #fffbeb;
    --purple: #8b5cf6;
    --purple-light: #f5f3ff;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.08);
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 15px;
  }

  .layout {
    display: flex;
    min-height: 100vh;
  }

  /* ── Sidebar ── */
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 260px;
    height: 100vh;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 28px 0;
    overflow-y: auto;
    z-index: 100;
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 0 24px 24px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    margin-bottom: 8px;
  }
  .sidebar-header h2 {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .sidebar-header p {
    font-size: 12px;
    color: var(--sidebar-text);
  }
  .sidebar-nav {
    list-style: none;
    flex: 1;
  }
  .sidebar-nav li a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    color: var(--sidebar-text);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    border-left: 3px solid transparent;
    transition: all .2s;
  }
  .sidebar-nav li a:hover,
  .sidebar-nav li a.active {
    color: var(--sidebar-active);
    background: rgba(255,255,255,.05);
    border-left-color: var(--sidebar-accent);
  }
  .sidebar-nav li a .nav-icon {
    width: 18px;
    text-align: center;
    font-size: 14px;
  }
  .sidebar-footer {
    padding: 16px 24px;
    border-top: 1px solid rgba(255,255,255,.08);
    font-size: 11px;
    color: rgba(255,255,255,.3);
  }

  /* ── Main ── */
  .main-content {
    margin-left: 260px;
    flex: 1;
    padding: 36px 48px 80px;
    max-width: 960px;
  }
  .article-wrap {
    max-width: 780px;
  }

  /* ── Meeting Info Card ── */
  .meeting-info {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px 32px;
    box-shadow: var(--shadow);
    margin-bottom: 32px;
  }
  .meeting-info h1 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 20px;
    color: var(--text);
  }
  .meeting-info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .info-item .label {
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-secondary);
  }
  .info-item .value {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
  }

  /* ── Sections ── */
  .section-divider {
    margin: 40px 0 28px;
  }
  .section-divider h2 {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    padding-bottom: 10px;
    border-bottom: 2px solid var(--accent);
    display: inline-block;
  }
  .section-divider + p,
  .section-desc {
    margin-top: 8px;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.8;
  }

  /* ── Highlight box ── */
  .highlight-box {
    background: var(--accent-light);
    border-left: 4px solid var(--accent);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 18px 22px;
    margin: 20px 0;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
  }
  .highlight-box strong {
    color: var(--accent);
  }
  .highlight-box ul { margin: 8px 0 0 18px; }
  .highlight-box ul li { margin-bottom: 4px; }

  /* ── Feature cards ── */
  .feature-cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin: 20px 0;
  }
  .feature-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px 28px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--accent);
  }
  .feature-card.green { border-left-color: var(--green); }
  .feature-card.purple { border-left-color: var(--purple); }
  .feature-card.yellow { border-left-color: var(--yellow); }
  .feature-card.red { border-left-color: var(--red); }
  .feature-card h3 {
    font-size: 15.5px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .feature-card p,
  .feature-card ul {
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .feature-card ul { margin: 8px 0 0 18px; }
  .feature-card ul li { margin-bottom: 4px; }

  /* ── Badge ── */
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .3px;
    vertical-align: middle;
  }
  .badge-blue  { background: var(--accent-light); color: var(--accent); }
  .badge-green { background: var(--green-light); color: var(--green); }
  .badge-red   { background: var(--red-light); color: var(--red); }
  .badge-yellow{ background: var(--yellow-light); color: var(--yellow); }
  .badge-purple{ background: var(--purple-light); color: var(--purple); }
  .badge-gray  { background: var(--gray-light); color: var(--gray); }

  /* ── Issue list ── */
  .issue-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 20px 0;
  }
  .issue-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .issue-card .issue-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .issue-card .issue-icon.warn { background: var(--yellow-light); }
  .issue-card .issue-icon.error { background: var(--red-light); }
  .issue-card .issue-icon.info { background: var(--accent-light); }
  .issue-card h4 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .issue-card p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  /* ── Decision list ── */
  .decision-list {
    list-style: none;
    margin: 20px 0;
  }
  .decision-list li {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 14px 20px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    font-size: 14px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .decision-list li .decision-check {
    color: var(--green);
    font-weight: 800;
    font-size: 15px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .decision-list li .decision-body {
    flex: 1;
  }

  /* ── Annotation ── */
  .annotation {
    display: block;
    margin-top: 8px;
    padding: 10px 14px;
    background: var(--gray-light);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.7;
    border-left: 3px solid var(--border);
  }
  .annotation strong {
    color: var(--text);
    font-weight: 600;
  }

  /* ── Data table ── */
  .data-table-wrap {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin: 20px 0;
  }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .data-table thead th {
    background: var(--sidebar-bg);
    color: #fff;
    padding: 12px 16px;
    text-align: left;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: .3px;
  }
  .data-table tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .data-table tbody tr:last-child td { border-bottom: none; }
  .data-table tbody tr:hover { background: #f9fafb; }

  /* ── Timeline ── */
  .timeline {
    position: relative;
    margin: 20px 0;
    padding-left: 28px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: var(--border);
  }
  .timeline-item {
    position: relative;
    margin-bottom: 18px;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--accent);
  }
  .timeline-item .timestamp {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: .3px;
  }
  .timeline-item p {
    font-size: 13.5px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .timestamp {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 1px 7px;
    border-radius: 4px;
  }

  /* ── AI Comment Section ── */
  .ai-comment-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 20px 0;
  }
  .ai-comment-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--purple);
  }
  .ai-comment-card.suggestion { border-left-color: var(--accent); }
  .ai-comment-card.warning { border-left-color: var(--yellow); }
  .ai-comment-card.risk { border-left-color: var(--red); }
  .ai-comment-card h4 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ai-comment-card p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .ai-comment-card ul {
    margin: 8px 0 0 18px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .ai-comment-card ul li { margin-bottom: 4px; }
  .ai-label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--purple);
    background: var(--purple-light);
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  /* ── Next meeting / Open items ── */
  .next-meeting {
    background: linear-gradient(135deg, #1e2432 0%, #2d3548 100%);
    color: #fff;
    border-radius: var(--radius);
    padding: 28px 32px;
    margin: 24px 0;
  }
  .next-meeting h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .next-meeting ul {
    margin-left: 18px;
    font-size: 14px;
    line-height: 1.9;
    color: rgba(255,255,255,.85);
  }
  .next-meeting ul li { margin-bottom: 4px; }

  /* ── Footer ── */
  .report-footer {
    text-align: center;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* ── Scroll-to-top ── */
  .scroll-top {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 18px;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    transform: translateY(12px);
    transition: all .3s;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scroll-top.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Print ── */
  @media print {
    .sidebar, .scroll-top { display: none !important; }
    .main-content { margin-left: 0; padding: 0; }
    .article-wrap { max-width: 100%; }
  }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .main-content { margin-left: 0; padding: 24px 20px 60px; }
  }
</style>
</head>
<body>
<div class="layout">

  <!-- ──────── SIDEBAR ──────── -->
  {{SIDEBAR}}

  <!-- ──────── MAIN ──────── -->
  <div class="main-content">
    <div class="article-wrap">

      {{CONTENT}}

      <!-- ── Footer ── -->
      <div class="report-footer">
        텍스트 트랜스크립트 기반 &middot; Claude 회의록 자동 생성
      </div>

    </div>
  </div>
</div>

<!-- Scroll-to-top -->
<button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">&uarr;</button>

<script>
  // ── Scroll-to-top visibility ──
  const scrollBtn = document.getElementById('scrollTopBtn');
  window.addEventListener('scroll', () => {
    scrollBtn.classList.toggle('visible', window.scrollY > 400);
  });

  // ── Sidebar active tracking ──
  const sections = document.querySelectorAll('.section-divider[id]');
  const navLinks = document.querySelectorAll('.sidebar-nav a');

  function updateActiveNav() {
    let current = '';
    sections.forEach(section => {
      const rect = section.getBoundingClientRect();
      if (rect.top <= 120) {
        current = section.id;
      }
    });
    navLinks.forEach(link => {
      link.classList.remove('active');
      if (link.getAttribute('href') === '#' + current) {
        link.classList.add('active');
      }
    });
  }

  window.addEventListener('scroll', updateActiveNav);
  window.addEventListener('load', updateActiveNav);
</script>
</body>
</html>
