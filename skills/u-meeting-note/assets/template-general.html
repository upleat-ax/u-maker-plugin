<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --sidebar-bg: #1e2432;
    --sidebar-text: #b0b8c9;
    --sidebar-active: #ffffff;
    --sidebar-accent: #4f8cff;
    --text: #1e2432;
    --text-secondary: #5a6376;
    --border: #e2e5ea;
    --accent: #4f8cff;
    --accent-light: #eaf1ff;
    --green: #22c55e;
    --green-light: #ecfdf5;
    --red: #ef4444;
    --red-light: #fef2f2;
    --yellow: #f59e0b;
    --yellow-light: #fffbeb;
    --purple: #8b5cf6;
    --purple-light: #f5f3ff;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.08);
    --article-w: 780px;
    --glance-w: 320px;
  }
  body.wide { --article-w: 1100px; }

  html { scroll-behavior: smooth; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 15px;
  }

  /* ── Reading progress ── */
  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    width: 0;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    z-index: 300;
    transition: width .1s linear;
  }

  .layout {
    display: flex;
    min-height: 100vh;
  }

  /* ── Sidebar ── */
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 260px;
    height: 100vh;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 28px 0;
    overflow-y: auto;
    z-index: 100;
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 0 24px 24px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    margin-bottom: 8px;
  }
  .sidebar-header h2 {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .sidebar-header p {
    font-size: 12px;
    color: var(--sidebar-text);
  }
  .sidebar-nav {
    list-style: none;
    flex: 1;
  }
  .sidebar-nav li a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    color: var(--sidebar-text);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    border-left: 3px solid transparent;
    transition: all .2s;
  }
  .sidebar-nav li a:hover,
  .sidebar-nav li a.active {
    color: var(--sidebar-active);
    background: rgba(255,255,255,.05);
    border-left-color: var(--sidebar-accent);
  }
  .sidebar-nav li a .nav-icon {
    width: 18px;
    text-align: center;
    font-size: 14px;
  }
  .sidebar-nav li a .nav-count {
    margin-left: auto;
    font-size: 10.5px;
    font-weight: 700;
    background: rgba(255,255,255,.1);
    color: var(--sidebar-text);
    padding: 1px 8px;
    border-radius: 999px;
  }
  .sidebar-footer {
    padding: 16px 24px;
    border-top: 1px solid rgba(255,255,255,.08);
    font-size: 11px;
    color: rgba(255,255,255,.3);
  }

  /* ── Main ── */
  .main-content {
    margin-left: 260px;
    margin-right: var(--glance-w);
    flex: 1;
    padding: 36px 48px 80px;
    transition: margin-right .25s;
  }
  .article-wrap {
    max-width: var(--article-w);
    margin: 0 auto;
    transition: max-width .25s;
  }
  body.glance-off .main-content { margin-right: 0; }

  /* ── Glance rail (우측 한눈 요약: 요약·결정·미결·액션) ── */
  .glance {
    position: fixed;
    top: 0; right: 0;
    width: var(--glance-w);
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 26px 20px 32px;
    overflow-y: auto;
    z-index: 90;
    transition: transform .25s;
  }
  body.glance-off .glance { transform: translateX(100%); }
  .glance-head {
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 14px; margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .glance-head .g-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--purple));
  }
  .glance-title { font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--text-secondary); }
  .glance-block { padding: 15px 0; border-bottom: 1px solid var(--border); }
  .glance-block:last-child { border-bottom: none; }
  .glance-block h3 { font-size: 12.5px; font-weight: 700; margin-bottom: 9px; }
  .glance-block h3 a { color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .glance-block h3 a:hover { color: var(--accent); }
  .gb-ico { font-size: 13px; }
  .gb-count { margin-left: auto; font-size: 10.5px; font-weight: 800; background: var(--gray-light); color: var(--text-secondary); padding: 1px 8px; border-radius: 999px; }
  .gb-count.red { background: var(--red-light); color: var(--red); }
  .gb-count.green { background: var(--green-light); color: var(--green); }
  .gb-count.yellow { background: var(--yellow-light); color: var(--yellow); }
  .glance ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .glance-summary li { position: relative; padding-left: 13px; font-size: 12.5px; line-height: 1.55; color: var(--text); }
  .glance-summary li::before { content: '•'; position: absolute; left: 1px; color: var(--accent); font-weight: 800; }
  .glance-list li { position: relative; padding-left: 13px; font-size: 12px; line-height: 1.5; color: var(--text-secondary); }
  .glance-list li::before { content: '–'; position: absolute; left: 2px; color: var(--text-secondary); }
  .glance-actions li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 12px; line-height: 1.5; color: var(--text-secondary); }
  .glance-actions .ga-who { flex-shrink: 0; font-size: 11px; padding: 0 7px 0 6px; }
  .glance-empty { font-size: 12px; color: var(--gray); font-style: italic; }

  /* ── Meeting Info Card ── */
  .meeting-info {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px 32px;
    box-shadow: var(--shadow);
    margin-bottom: 32px;
  }
  .meeting-info h1 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 20px;
    color: var(--text);
  }
  .meeting-info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .info-item .label {
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-secondary);
  }
  .info-item .value {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
  }

  /* ── Stat chips (회의 산출 통계) ── */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .stat {
    background: var(--gray-light);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    text-align: center;
  }
  .stat .num {
    display: block;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.3;
  }
  .stat.green .num { color: var(--green); }
  .stat.red .num { color: var(--red); }
  .stat.purple .num { color: var(--purple); }
  .stat.yellow .num { color: var(--yellow); }
  .stat .cap {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  /* ── Sections ── */
  .section-divider {
    margin: 40px 0 28px;
  }
  .section-divider h2 {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    padding-bottom: 10px;
    border-bottom: 2px solid var(--accent);
    display: inline-block;
  }
  .section-divider + p,
  .section-desc {
    margin-top: 8px;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.8;
  }

  /* ── Highlight box ── */
  .highlight-box {
    background: var(--accent-light);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 18px 22px;
    margin: 20px 0;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
  }
  .highlight-box strong {
    color: var(--accent);
  }
  .highlight-box ul { margin: 8px 0 0 18px; }
  .highlight-box ul li { margin-bottom: 4px; }

  /* ── Speaker chips (화자 칩 — 참여자N 색상 고정) ── */
  .sp {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 700;
    padding: 1px 10px 1px 7px;
    border-radius: 999px;
    background: var(--gray-light);
    border: 1px solid var(--border);
    color: var(--text);
    white-space: nowrap;
    vertical-align: middle;
  }
  .sp::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gray);
  }
  .sp.s1::before { background: #4f8cff; }
  .sp.s2::before { background: #22c55e; }
  .sp.s3::before { background: #f59e0b; }
  .sp.s4::before { background: #8b5cf6; }
  .sp.s5::before { background: #ef4444; }
  .sp.s6::before { background: #06b6d4; }
  .sp.s7::before { background: #ec4899; }
  .sp.s8::before { background: #84cc16; }

  /* ── Quote (원 발언 인용) ── */
  .quote {
    background: var(--gray-light);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    margin: 10px 0;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .quote .quote-who {
    display: block;
    margin-top: 6px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--gray);
  }

  /* ── Feature cards ── */
  .feature-cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin: 20px 0;
  }
  .feature-card {
    background: var(--accent-light);
    border-radius: var(--radius);
    padding: 24px 28px;
    box-shadow: var(--shadow);
    border: 1px solid var(--accent);
  }
  .feature-card.green { border-color: var(--green); background: var(--green-light); }
  .feature-card.purple { border-color: var(--purple); background: var(--purple-light); }
  .feature-card.yellow { border-color: var(--yellow); background: var(--yellow-light); }
  .feature-card.red { border-color: var(--red); background: var(--red-light); }
  .feature-card h3 {
    font-size: 15.5px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .feature-card p,
  .feature-card ul {
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .feature-card ul { margin: 8px 0 0 18px; }
  .feature-card ul li { margin-bottom: 4px; }
  .topic-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(0,0,0,.06);
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* ── Badge ── */
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .3px;
    vertical-align: middle;
  }
  .badge-blue  { background: var(--accent-light); color: var(--accent); }
  .badge-green { background: var(--green-light); color: var(--green); }
  .badge-red   { background: var(--red-light); color: var(--red); }
  .badge-yellow{ background: var(--yellow-light); color: var(--yellow); }
  .badge-purple{ background: var(--purple-light); color: var(--purple); }
  .badge-gray  { background: var(--gray-light); color: var(--gray); }

  /* ── Issue list ── */
  .issue-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 20px 0;
  }
  .issue-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .issue-card .issue-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .issue-card .issue-icon.warn { background: var(--yellow-light); }
  .issue-card .issue-icon.error { background: var(--red-light); }
  .issue-card .issue-icon.info { background: var(--accent-light); }
  .issue-card h4 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .issue-card p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  /* ── Decision list ── */
  .decision-list {
    list-style: none;
    margin: 20px 0;
  }
  .decision-list li {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 14px 20px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    font-size: 14px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .decision-list li .decision-check {
    color: var(--green);
    font-weight: 800;
    font-size: 15px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .decision-list li .decision-body {
    flex: 1;
  }
  .decision-tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 700;
    vertical-align: middle;
  }
  .decision-tag.agree { background: var(--green-light); color: var(--green); }
  .decision-tag.hold  { background: var(--yellow-light); color: var(--yellow); }
  .decision-tag.cond  { background: var(--purple-light); color: var(--purple); }

  /* ── Annotation ── */
  .annotation {
    display: block;
    margin-top: 8px;
    padding: 10px 14px;
    background: var(--gray-light);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.7;
    border: 1px solid var(--border);
  }
  .annotation strong {
    color: var(--text);
    font-weight: 600;
  }

  /* ── Data table ── */
  .data-table-wrap {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin: 20px 0;
  }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .data-table thead th {
    background: var(--sidebar-bg);
    color: #fff;
    padding: 12px 16px;
    text-align: left;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: .3px;
  }
  .data-table tbody td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .data-table tbody tr:last-child td { border-bottom: none; }
  .data-table tbody tr:hover { background: #f9fafb; }

  /* ── Timeline ── */
  .timeline {
    position: relative;
    margin: 20px 0;
    padding-left: 28px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: var(--border);
  }
  .timeline-item {
    position: relative;
    margin-bottom: 18px;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--accent);
  }
  .timeline-item .timestamp {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: .3px;
  }
  .timeline-item p {
    font-size: 13.5px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .timestamp {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 1px 7px;
    border-radius: 4px;
  }

  /* ── Diagram (본문 인라인) ── */
  .diagram-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    margin: 20px 0;
    overflow-x: auto;
  }
  .diagram-card h4 {
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text-secondary);
  }
  .diagram-card svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ── Media figure (녹화 화면 캡쳐 — 선택) ── */
  .media-figure {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
    margin: 16px 0;
  }
  .media-figure img {
    width: 100%;
    display: block;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .media-figure figcaption {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ── Collapse (부가 논의 접기) ── */
  details.collapse {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin: 14px 0;
    box-shadow: var(--shadow);
  }
  details.collapse summary {
    cursor: pointer;
    padding: 12px 18px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    list-style: none;
  }
  details.collapse summary::-webkit-details-marker { display: none; }
  details.collapse summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 8px;
    color: var(--accent);
    transition: transform .15s;
  }
  details.collapse[open] summary::before { transform: rotate(90deg); }
  details.collapse .collapse-body {
    padding: 0 18px 16px;
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.8;
  }

  /* ── AI Comment Section ── */
  .ai-comment-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 20px 0;
  }
  .ai-comment-card {
    background: var(--purple-light);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--purple);
  }
  .ai-comment-card.suggestion { border-color: var(--accent); background: var(--accent-light); }
  .ai-comment-card.warning { border-color: var(--yellow); background: var(--yellow-light); }
  .ai-comment-card.risk { border-color: var(--red); background: var(--red-light); }
  .ai-comment-card h4 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ai-comment-card p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .ai-comment-card ul {
    margin: 8px 0 0 18px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .ai-comment-card ul li { margin-bottom: 4px; }
  .ai-label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--purple);
    background: var(--purple-light);
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  /* ── Next meeting / Open items ── */
  .next-meeting {
    background: linear-gradient(135deg, #1e2432 0%, #2d3548 100%);
    color: #fff;
    border-radius: var(--radius);
    padding: 28px 32px;
    margin: 24px 0;
  }
  .next-meeting h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .next-meeting ul {
    margin-left: 18px;
    font-size: 14px;
    line-height: 1.9;
    color: rgba(255,255,255,.85);
  }
  .next-meeting ul li { margin-bottom: 4px; }

  /* ── Footer ── */
  .report-footer {
    text-align: center;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* ── Floating tools (폭 토글 + 스크롤 탑) ── */
  .float-tools {
    position: fixed;
    bottom: 32px;
    right: calc(var(--glance-w) + 24px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 200;
    transition: right .25s;
  }
  body.glance-off .float-tools { right: 32px; }
  .float-tools button {
    border: none;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .width-toggle {
    height: 42px;
    padding: 0 16px;
    border-radius: 999px;
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    border: 1px solid var(--border) !important;
  }
  .width-toggle:hover { color: var(--accent); }
  .scroll-top {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    opacity: 0;
    transform: translateY(12px);
    transition: all .3s;
    pointer-events: none;
  }
  .scroll-top.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* ── Print ── */
  @media print {
    .sidebar, .glance, .float-tools, .progress-bar { display: none !important; }
    .main-content { margin-left: 0; margin-right: 0; padding: 0; max-width: 100%; }
    .article-wrap { max-width: 100%; }
    .feature-card, .issue-card, .ai-comment-card, .decision-list li { break-inside: avoid; }
  }

  /* ── Responsive ── */
  @media (max-width: 1200px) {
    .glance { transform: translateX(100%); }
    .main-content { margin-right: 0; }
    .float-tools { right: 32px; }
  }
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .main-content { margin-left: 0; padding: 24px 20px 60px; }
  }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="layout">

  <!-- ──────── SIDEBAR ──────── -->
  <!-- {{SIDEBAR}}: 아래 구조를 회의 내용에 맞게 채운다.
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>회의 제목 (짧게)</h2>
      <p>회의 유형 · YYYY-MM-DD</p>
    </div>
    <ul class="sidebar-nav">
      <li><a href="#overview"><span class="nav-icon">01</span>개요</a></li>
      <li><a href="#attendees"><span class="nav-icon">02</span>참석자 &amp; 안건</a></li>
      <li><a href="#discussion"><span class="nav-icon">03</span>논의 내용<span class="nav-count">6</span></a></li>
      <li><a href="#decisions"><span class="nav-icon">04</span>결정 사항<span class="nav-count">4</span></a></li>
      <li><a href="#actions"><span class="nav-icon">05</span>액션 아이템<span class="nav-count">7</span></a></li>
      <li><a href="#ai-comments"><span class="nav-icon">06</span>AI 커멘트</a></li>
    </ul>
    <div class="sidebar-footer">Google Meet 녹화 기반 · u-meeting-note 자동 생성</div>
  </aside>
  -->
  {{SIDEBAR}}

  <!-- ──────── MAIN ──────── -->
  <div class="main-content">
    <div class="article-wrap">

      <!-- {{CONTENT}}: meeting-info(메타 그리드 + stat-row) → 01~06 섹션.
           컴포넌트 사용법은 references/design-system-general.md 참조. -->
      {{CONTENT}}

      <!-- ── Footer ── -->
      <div class="report-footer">
        Google Meet 녹화 · Gemini 스크립트 기반 &middot; u-meeting-note 자동 생성
      </div>

    </div>
  </div>

  <!-- ──────── GLANCE RAIL (우측 한눈 요약) ──────── -->
  <!-- {{GLANCE}}: 요약 3~5줄 + 결정/미결/액션(본문 앵커 링크). 각 줄은 한 줄 요약(길게 쓰지 말 것).
       빈 블록은 <li class="glance-empty">없음</li>.
  <aside class="glance">
    <div class="glance-head"><span class="g-dot"></span><span class="glance-title">한눈에 보기</span></div>
    <section class="glance-block">
      <h3><i class="gb-ico fa-solid fa-thumbtack" aria-hidden="true"></i> 요약</h3>
      <ul class="glance-summary"><li>핵심 결론 한 줄</li></ul>
    </section>
    <section class="glance-block">
      <h3><a href="#decisions"><i class="gb-ico fa-solid fa-circle-check" aria-hidden="true"></i> 결정사항 <span class="gb-count green">4</span></a></h3>
      <ul class="glance-list"><li>결정 한 줄</li></ul>
    </section>
    <section class="glance-block">
      <h3><a href="#open-issues"><i class="gb-ico fa-solid fa-hourglass-half" aria-hidden="true"></i> 미결사항 <span class="gb-count red">2</span></a></h3>
      <ul class="glance-list"><li>미결 한 줄</li></ul>
    </section>
    <section class="glance-block">
      <h3><a href="#actions"><i class="gb-ico fa-solid fa-list-check" aria-hidden="true"></i> 액션 아이템 <span class="gb-count">7</span></a></h3>
      <ul class="glance-actions"><li><span class="ga-who sp s1">참여자1</span> 액션 한 줄</li></ul>
    </section>
  </aside>
  -->
  {{GLANCE}}
</div>

<!-- Floating tools -->
<div class="float-tools">
  <button class="width-toggle" id="glanceToggle" title="요약 패널 접기/펼치기">요약 숨김</button>
  <button class="width-toggle" id="widthToggle" title="본문 폭 전환">본문 넓게</button>
  <button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">&uarr;</button>
</div>

<script>
  // ── Reading progress ──
  const progressBar = document.getElementById('progressBar');
  function updateProgress() {
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    progressBar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
  }
  window.addEventListener('scroll', updateProgress);
  window.addEventListener('load', updateProgress);

  // ── Scroll-to-top visibility ──
  const scrollBtn = document.getElementById('scrollTopBtn');
  window.addEventListener('scroll', () => {
    scrollBtn.classList.toggle('visible', window.scrollY > 400);
  });

  // ── Width toggle (보통 780px ↔ 넓게 1100px) ──
  const widthToggle = document.getElementById('widthToggle');
  widthToggle.addEventListener('click', () => {
    const wide = document.body.classList.toggle('wide');
    widthToggle.textContent = wide ? '본문 좁게' : '본문 넓게';
  });

  // ── Glance rail toggle ──
  const glanceToggle = document.getElementById('glanceToggle');
  if (glanceToggle) {
    glanceToggle.addEventListener('click', () => {
      const off = document.body.classList.toggle('glance-off');
      glanceToggle.textContent = off ? '요약 열기' : '요약 숨김';
    });
  }

  // ── Sidebar active tracking ──
  const sections = document.querySelectorAll('.section-divider[id]');
  const navLinks = document.querySelectorAll('.sidebar-nav a');

  function updateActiveNav() {
    let current = '';
    sections.forEach(section => {
      const rect = section.getBoundingClientRect();
      if (rect.top <= 120) {
        current = section.id;
      }
    });
    navLinks.forEach(link => {
      link.classList.remove('active');
      if (link.getAttribute('href') === '#' + current) {
        link.classList.add('active');
      }
    });
  }

  window.addEventListener('scroll', updateActiveNav);
  window.addEventListener('load', updateActiveNav);
</script>
</body>
</html>
